# Netlify Deployment Configuration for CareAura / AegisCare Platform
# Base directory: Unset (defaults to repository root /)

[build]
  command = "echo 'Static frontend build complete'"
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://aegiscare-hospital-platform-1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
